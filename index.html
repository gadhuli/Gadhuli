
<!DOCTYPE html>
<html lang="en">
<head>

*{

    padding:0;
    box-sizing:border-box;

body{

}

header{
    background:white;

    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:24px;
    font-weight:800;
    color:#8f174d;
}

.logo-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#8f174d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
}

nav a{
    text-decoration:none;
    color:#333;
    margin-left:15px;
    font-weight:600;
}

.cart-btn{
    background:#8f174d;
    color:white;
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#cartCount{
    background:white;
    color:#8f174d;
    padding:2px 6px;
    border-radius:20px;
    margin-left:4px;
}

.hero{
    padding:70px 7%;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#8f174d,#c52b70);
}

.hero h1{
    font-size:42px;
    margin-bottom:14px;
}

.hero p{
    font-size:18px;
    margin-bottom:28px;
}

.btn{
    display:inline-block;
    padding:13px 28px;
    background:white;
    color:#8f174d;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.section{
    padding:48px 6%;
}

.section h2{
    text-align:center;
    margin-bottom:30px;
    color:#8f174d;
    font-size:28px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:16px;
}

.category{
    background:white;
    padding:22px 10px;
    text-align:center;
    border-radius:14px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
    font-weight:bold;
    cursor:pointer;
}

.category.active,
.category:hover{
    background:#8f174d;
    color:white;
}

.search-box{
    max-width:600px;
    margin:0 auto 25px;
    display:flex;
    gap:8px;
}

.search-box input{
    flex:1;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}
