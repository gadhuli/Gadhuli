<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gadhuli</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f9;
  color:#222;
}

header{
  background:white;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#8f174d;
  font-size:22px;
  font-weight:bold;
}

.logo img{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:10px;
}

.cartBtn{
  background:#8f174d;
  color:white;
  border:none;
  padding:11px 16px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#8f174d,#d72f78);
  color:white;
  text-align:center;
  padding:45px 20px;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  margin:0;
}

.section{
  padding:25px 18px;
  max-width:1100px;
  margin:auto;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}

.product{
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
  text-align:center;
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  background:#f7e1eb;
}

.product .emoji{
  height:150px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:65px;
  background:#fbe8f0;
  border-radius:10px;
}

.product h3{
  margin:12px 0 5px;
}

.price{
  color:#8f174d;
  font-size:19px;
  font-weight:bold;
  margin:7px 0 12px;
}

.btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#8f174d;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.admin{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.admin h2{
  color:#8f174d;
}

input,textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.adminProduct{
  border-top:1px solid #eee;
  padding:12px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.smallBtn{
  padding:7px 10px;
  border:0;
  border-radius:6px;
  cursor:pointer;
}

.edit{
  background:#eee;
}

.delete{
  background:#d7194b;
  color:white;
}

.order{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.order h2{
  color:#8f174d;
}

.whatsapp{
  background:#159447;
  margin-top:10px;
}

.cart{
  display:none;
  position:fixed;
  right:0;
  top:0;
  width:330px;
  max-width:90%;
  height:100%;
  background:white;
  z-index:100;
  padding:20px;
  box-shadow:-4px 0 15px rgba(0,0,0,.25);
  overflow-y:auto;
}

.cartHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  background:#eee;
  border:0;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}

.cartItem{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.remove{
  background:#d7194b;
  color:white;
  border:0;
  padding:5px 8px;
  border-radius:5px;
  float:right;
}

.total{
  font-size:20px;
  font-weight:bold;
  color:#8f174d;
  margin:18px 0;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

footer{
  margin-top:30px;
  background:#8f174d;
  color:white;
  text-align:center;
  padding:20px;
}

@media(max-width:500px){
  .hero h1{
    font-size:25px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .product img,
  .product .emoji{
    height:120px;
  }

  .cart{
    width:100%;
    max-width:100%;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

  <div class="logo">
    <img src="logo.png" alt="Gadhuli Logo">
    <span>Gadhuli</span>
  </div>

  <button class="cartBtn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>

</header>


<!-- HERO -->
<section class="hero">

  <h1>Gadhuli</h1>

  <p>Shop Your Favorite Products</p>

</section>


<!-- PRODUCTS -->
<section class="section">

  <h2>🛍️ Products</h2>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Search product..."
    oninput="showProducts()"
  >

  <div class="products" id="products"></div>

</section>


<!-- ORDER FORM -->
<section class="section">
