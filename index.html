<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadhuli</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5f9;
}

header{
    background:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:24px;
    font-weight:bold;
    color:#8f174d;
}

.logo img{
    width:45px;
    height:45px;
    object-fit:contain;
    border-radius:10px;
    display:block;
}

.cart{
    background:#8f174d;
    color:white;
    border:0;
    padding:10px 15px;
    border-radius:8px;
}

.hero{
    background:#8f174d;
    color:white;
    text-align:center;
    padding:40px 15px;
}

.section{
    padding:20px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:15px;
}

.product{
    background:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 2px 8px #0002;
}

.emoji{
    font-size:55px;
}

.price{
    color:#8f174d;
    font-weight:bold;
    font-size:18px;
}

.add{
    background:#8f174d;
    color:white;
    border:0;
    padding:10px;
    border-radius:7px;
    width:100%;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

.order,
.admin{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #0002;
}

h2{
    color:#8f174d;
}

.whatsapp{
    background:#159447;
    color:white;
    border:0;
    padding:12px;
    width:100%;
    border-radius:8px;
}

.adminAdd{
    background:#8f174d;
    color:white;
    border:0;
    padding:12px;
    width:100%;
    border-radius:8px;
}

.adminItem{
    padding:12px 0;
    border-top:1px solid #eee;
}

.delete{
    background:#d7194b;
    color:white;
    border:0;
    padding:7px 12px;
    border-radius:6px;
    margin-top:6px;
}

#cartBox{
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:300px;
    height:100%;
    background:white;
    padding:20px;
    box-shadow:-3px 0 10px #0003;
    z-index:100;
    overflow-y:auto;
    box-sizing:border-box;
}

.remove{
    background:red;
    color:white;
    border:0;
    padding:4px;
    border-radius:5px;
}

@media(max-width:500px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</
