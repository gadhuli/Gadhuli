<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadhuli</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5f9;
    color:#222;
}

header{
    background:#fff;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:24px;
    font-weight:bold;
    color:#8f174d;
}

.logo img{
    width:45px;
    height:45px;
    object-fit:contain;
    border-radius:10px;
}

.cart-button{
    background:#8f174d;
    color:white;
    border:0;
    padding:10px 15px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.hero{
    background:linear-gradient(135deg,#8f174d,#d72f78);
    color:white;
    text-align:center;
    padding:45px 15px;
}

.hero h1{
    margin:0 0 10px;
    font-size:30px;
}

.hero p{
    margin:0;
}

.section{
    max-width:1100px;
    margin:auto;
    padding:22px 16px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:15px;
}

.product{
    background:#fff;
    padding:14px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 2px 8px #0002;
}

.product-image{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:9px;
}

.emoji{
    height:140px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    background:#fbe8f0;
    border-radius:9px;
}

.product h3{
    margin:10px 0 6px;
}

.price{
    color:#8f174d;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.add-button,
.admin-button{
    width:100%;
    background:#8f174d;
    color:white;
    border:0;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
}

.order,
.admin{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #0002;
}

h2{
    color:#8f174d;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

.whatsapp{

    border:0;
    padding:12px;
