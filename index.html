<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadhuli</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5f9;
}

header{
    background:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#8f174d;
}

.cart{
    background:#8f174d;
    color:white;
    border:0;
    padding:10px 15px;
    border-radius:8px;
}

.hero{
    background:#8f174d;
    color:white;
    text-align:center;
    padding:40px 15px;
}

.section{
    padding:20px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:15px;
}

.product{
    background:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 2px 8px #0002;
}

.emoji{
    font-size:55px;
}

.price{
    color:#8f174d;
    font-weight:bold;
    font-size:18px;
}

button{
    cursor:pointer;
}

.add{
    background:#8f174d;
    color:white;
    border:0;
    padding:10px;
    border-radius:7px;
    width:100%;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

.order{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #0002;
}

.whatsapp{
    background:#159447;
    color:white;
    border:0;
    padding:12px;
    width:100%;
    border-radius:8px;
}

#cartBox{
    display:none;
    position:fixed;
    right:0;
    top:0;
    width:300px;
    height:100%;
    background:white;
    padding:20px;
    box-shadow:-3px 0 10px #0003;
    z-index:100;
}

.remove{
    background:red;
    color:white;
    border:0;
    padding:4px;
    border-radius:5px;
}

@media(max-width:500px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Gadhuli
    </div>

    <button class="cart" onclick="openCart()">
        🛒 <span id="cartCount">0</span>
    </button>

</header>


<div class="hero">

    <h1>Gadhuli Official Website</h1>

    <p>Online Shopping</p>

</div>


<section class="section">

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 Search Product"
        oninput="showProducts()"
    >

    <h2>🛍️ Products</h2>

    <div class="products" id="products"></div>

</section>


<section class="section">

    <div class="order">

        <h2>📦 Place Your Order</h2>

        <input
            id="name"
            type="text"
            placeholder="👤 Name"
        >

        <input
            id="phone"
            type="tel"
            placeholder="📱 Phone"
        >

        <textarea
            id="address"
            rows="4"
            placeholder="📍 Address"
        ></textarea>

        <button
            class="whatsapp"
            onclick="orderWhatsApp()"
        >
            💬 Order via WhatsApp
        </button>

    </div>

</section>


<div id="cartBox">

    <button onclick="closeCart()">✕</button>

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <h3>
        Total ৳<span id="total">0</span>
    </h3>

</div>


<script>

let products = [
    {
        name:"T-Shirt",
        price:800,
        emoji:"👕"
    },
    {
        name:"Watch",
        price:1200,
        emoji:"⌚"
    },
    {
        name:"Shoes",
        price:1500,
        emoji:"👟"
    },
    {
        name:"Bag",
        price:950,
        emoji:"🎒"
    }
];

let cart = [];


function showProducts(){

    let box = document.getElementById("products");

    let search =
        document.getElementById("search").value.toLowerCase();

    box.innerHTML = "";

    products.forEach(function(product,index){

        if(product.name.toLowerCase().includes(search)){

            box.innerHTML += `

                <div class="product">

                    <div class="emoji">
                        ${product.emoji}
                    </div>

                    <h3>
                        ${product.name}
                    </h3>

                    <div class="price">
                        ৳${product.price}
                    </div>

                    <br>

                    <button
                        class="add"
                        onclick="addCart(${index})"
                    >
                        ➕ Add to Cart
                    </button>

                </div>

            `;

        }

    });

}


function addCart(index){

    cart.push(products[index]);

    updateCart();

}


function updateCart(){

    document.getElementById("cartCount").innerText =
        cart.length;

    let box =
        document.getElementById("cartItems");

    let total = 0;

    box.innerHTML = "";

    cart.forEach(function(item,index){

        total += item.price;

        box.innerHTML += `

            <p>

                ${item.emoji}
                ${item.name}
                - ৳${item.price}

                <button
                    class="remove"
                    onclick="removeCart(${index})"
                >
                    ❌
                </button>

            </p>

        `;

    });

    document.getElementById("total").innerText =
        total;

}


function removeCart(index){

    cart.splice(index,1);

    updateCart();

}


function openCart(){

    document.getElementById("cartBox")
        .style.display="block";

}


function closeCart(){

    document.getElementById("cartBox")
        .style.display="none";

}


function orderWhatsApp(){

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let address =
        document.getElementById("address").value.trim();


    if(name==="" || phone==="" || address===""){

        alert("সব তথ্য পূরণ করুন");

        return;

    }


    if(cart.length===0){

        alert("আগে Product Add to Cart করুন");

        return;

    }


    let message =
        "🛍️ Gadhuli Order\n\n";

    message +=
        "👤 Name: " + name + "\n";

    message +=
        "📱 Phone: " + phone + "\n";

    message +=
        "📍 Address: " + address + "\n\n";

    message +=
        "🛒 Products:\n";


    let total=0;


    cart.forEach(function(item,index){

        message +=
            (index+1) +
            ". " +
            item.name +
            " - ৳" +
            item.price +
            "\n";

        total += item.price;

    });


    message +=
        "\n💰 Total: ৳" + total;


    let url =
        "https://wa.me/8801333088194?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}


showProducts();

updateCart();

</script>

</body>
</html>
