<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gadhuli</title><style>body{margin:0;font-family:Arial;background:#fff7fa}header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;box-shadow:0 2px 10px #0002}.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:#8f174d}.logo img{width:42px;height:42px;border-radius:12px}.hero{padding:60px;text-align:center;color:#fff;background:linear-gradient(135deg,#8f174d,#c52b70)}.s{padding:22px}.p{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.c{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0002;padding:12px;text-align:center}.b{background:#8f174d;color:#fff;border:0;padding:10px;border-radius:8px;width:100%}input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px}</style></head><body><header><div class='logo'><img src='logo.png'><span>Gadhuli</span></div><button class='b' style='width:auto' onclick='v()'>🛒<span id=x>0</span></button></header><section class='hero'><h1>Gadhuli Official Website</h1></section><section class='s'><input id=q placeholder='Search' oninput='r()'><div class='p' id=l></div></section><section class='s'><h2 style='color:#8f174d'>Place Your Order</h2><input id=n placeholder='Name'><input id=ph placeholder='Phone'><textarea id=a placeholder='Address'></textarea><button class='b' onclick='o()'>Order Now</button></section><div id=cart style='display:none;position:fixed;right:0;top:0;width:280px;height:100%;background:#fff;padding:15px;box-shadow:-2px 0 10px #0003'><button onclick='cart.style.display="none"'>✕</button><div id=i></div><p>Total ৳<span id=t>0</span></p></div><script>let d=[['👕','T-Shirt',800],['⌚','Watch',1200],['👟','Shoes',1500],['🎒','Bag',950]],k=[];function r(){l.innerHTML='';d.filter(z=>z[1].toLowerCase().includes(q.value.toLowerCase())).forEach((z,m)=>l.innerHTML+=`<div class=c><div style=font-size:42px>${z[0]}</div><b>${z[1]}</b><p>৳${z[2]}</p><button class=b onclick='A(${m})'>Add</button></div>`)}function A(m){k.push(d[m]);u();v()}function u(){x.innerText=k.length;i.innerHTML='';let s=0;k.forEach((z,j)=>{s+=z[2];i.innerHTML+=`${z[0]} ${z[1]} ৳${z[2]} <button onclick='R(${j})'>❌</button><br>`});t.innerText=s}function R(j){k.splice(j,1);u()}function v(){cart.style.display='block'}function o(){if(!n.value||!ph.value||!a.value){alert('সব তথ্য পূরণ করুন');return}let m=`🛍️ Gadhuli Order\nName:${n.value}\nPhone:${ph.value}\nAddress:${a.value}\nItems:${k.map(z=>z[1]).join(', ')}`;open('https://wa.me/8801333088194?text='+encodeURIComponent(m))}r()</script></body></html>
