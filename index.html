<!DOCTYPE html>  <html lang="bn">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    <meta name="google-site-verification" content="lkVxExaUcJinZDbyNwrJL4Jhc3kjkYTwQXLFYYKu_p8">    <title>Gadhuli | Official Website</title>    <style>  
    *{  
      margin:0;  
      padding:0;  
      box-sizing:border-box;  
    }  
  
    body{  
      font-family:Arial, sans-serif;  
      background:#fff7fa;  
      color:#222;  
    }  
  
    header{  
      background:#fff;  
      position:sticky;  
      top:0;  
      z-index:1000;  
      box-shadow:0 2px 10px rgba(0,0,0,.08);  
    }  
  
    .navbar{  
      max-width:1200px;  
      margin:auto;  
      padding:12px 18px;  
      display:flex;  
      align-items:center;  
      justify-content:space-between;  
    }  
  
    .logo{  
      display:flex;  
      align-items:center;  
      gap:10px;  
      color:#8f174d;  
      font-size:24px;  
      font-weight:800;  
    }  
  
    .logo-icon{  
      width:43px;  
      height:43px;  
      border-radius:12px;  
      background:#8f174d;  
      color:#fff;  
      display:flex;  
      align-items:center;  
      justify-content:center;  
      font-size:24px;  
      font-weight:900;  
    }  
  
    nav{  
      display:flex;  
      gap:18px;  
    }  
  
    nav a{  
      text-decoration:none;  
      color:#333;  
      font-weight:600;  
    }  
  
    nav a:hover{  
      color:#8f174d;  
    }  
    .hero{  
      max-width:1200px;  
      margin:20px auto;  
      padding:55px 25px;  
      border-radius:20px;  
      background:linear-gradient(135deg,#ffd6e7,#f7b3d0);  
      text-align:center;  
    }  
  
    .hero h1{  
      font-size:42px;  
      color:#8f174d;  
      margin-bottom:12px;  
    }  
  
    .hero p{  
      font-size:18px;  
      color:#555;  
      margin-bottom:22px;  
    }  
  
    .shop-btn{  
      display:inline-block;  
      padding:13px 28px;  
      border-radius:30px;  
      background:#8f174d;  
      color:#fff;  
      text-decoration:none;  
      font-weight:bold;  
      border:none;  
      cursor:pointer;  
    }  
  
    .shop-btn:hover{  
      opacity:.9;  
    }  
  
    .section{  
      max-width:1200px;  
      margin:35px auto;  
      padding:0 18px;  
    }  
  
    .section-title{  
      text-align:center;  
      color:#8f174d;  
      font-size:30px;  
      margin-bottom:22px;  
    }  
  
    .products{  
      display:grid;  
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));  
      gap:20px;  
    }  
  
    .product{  
      background:#fff;  
      border-radius:16px;  
      overflow:hidden;  
      box-shadow:0 4px 15px rgba(0,0,0,.08);  
      transition:.2s;  
    }  
  
    .product:hover{  
      transform:translateY(-4px);  
    }  
  
    .product img{  
      width:100%;  
      height:210px;  
      object-fit:cover;  
      display:block;  
    }  
  
    .product-info{  
      padding:15px;  
    }  
  
    .product-info h3{  
      font-size:18px;  
      margin-bottom:8px;  
    }  
  
    .price{  
      color:#8f174d;  
      font-size:20px;  
      font-weight:bold;  
      margin-bottom:12px;  
    }  
  
    .cart-btn{  
      width:100%;  
      padding:10px;  
      border:0;  
      border-radius:8px;  
      background:#8f174d;  
      color:#fff;  
      font-weight:bold;  
      cursor:pointer;  
    }  
    .cart{  
      max-width:1200px;  
      margin:30px auto;  
      padding:20px;  
      background:#fff;  
      border-radius:16px;  
      box-shadow:0 4px 15px rgba(0,0,0,.08);  
    }  
  
    .cart h2{  
      color:#8f174d;  
      margin-bottom:15px;  
    }  
  
    #cartItems{  
      margin-bottom:15px;  
    }  
  
    .cart-item{  
      display:flex;  
      align-items:center;  
      justify-content:space-between;  
      gap:10px;  
      padding:12px 0;  
      border-bottom:1px solid #eee;  
    }  
  
    .remove-btn{  
      border:0;  
      background:#eee;  
      padding:7px 12px;  
      border-radius:7px;  
      cursor:pointer;  
    }  
  
    .total{  
      font-size:21px;  
      font-weight:bold;  
      color:#8f174d;  
      margin-top:15px;  
    }  
  
    footer{  
      margin-top:40px;  
      padding:25px 15px;  
      background:#8f174d;  
      color:#fff;  
      text-align:center;  
    }  
  
    footer p{  
      margin:6px 0;  
    }  
  
    @media(max-width:600px){  
      .navbar{  
        padding:10px 12px;  
      }  
  
      .logo{  
        font-size:20px;  
      }  
  
      .logo-icon{  
        width:38px;  
        height:38px;  
        font-size:21px;  
      }  
  
      nav{  
        gap:10px;  
      }  
  
      nav a{  
        font-size:13px;  
      }  
  
      .hero{  
        margin:12px;  
        padding:40px 18px;  
      }  
  
      .hero h1{  
        font-size:32px;  
      }  
  
      .hero p{  
        font-size:16px;  
      }  
  
      .products{  
        grid-template-columns:repeat(2,1fr);  
        gap:12px;  
      }  
  
      .product img{  
        height:160px;  
      }  
  
      .product-info{  
        padding:11px;  
      }  
  
      .product-info h3{  
        font-size:15px;  
      }  
  
      .price{  
        font-size:17px;  
      }  
    }  
  </style>  </head>  <body>    <header>  
    <div class="navbar">  
      <div class="logo">  
        <div class="logo-icon">G</div>  
        Gadhuli  
      </div>  <nav>  
    <a href="#home">Home</a>  
    <a href="#products">Products</a>  
    <a href="#cart">Cart 🛒</a>  
  </nav>  
</div>

  </header>    <main id="home">  
    <section class="hero">  
      <h1>Shopping? Gadhuli</h1>  
      <p>আপনার পছন্দের পণ্য এখন এক জায়গায়</p>  
      <a href="#products" class="shop-btn">Shop Now</a>  
    </section>  <section class="section" id="products">  
  <h2 class="section-title">Our Products</h2>  

  <div class="products" id="productList">  

    <div class="product">  
      <img src="https://via.placeholder.com/500x500?text=T-Shirt" alt="T-Shirt">  
      <div class="product-info">  
        <h3>Premium T-Shirt</h3>  
        <div class="price">৳800</div>  
        <button class="cart-btn" onclick="addToCart('Premium T-Shirt',800)">  
          Add to Cart  
        </button>  
      </div>  
    </div>  

    <div class="product">  
      <img src="https://via.placeholder.com/500x500?text=Watch" alt="Watch">  
      <div class="product-info">  
        <h3>Stylish Watch</h3>  
        <div class="price">৳1200</div>  
        <button class="cart-btn" onclick="addToCart('Stylish Watch',1200)">  
          Add to Cart  
        </button>  
      </div>  
    </div>  

    <div class="product">  
      <img src="https://via.placeholder.com/500x500?text=Cap" alt="Cap">  
      <div class="product-info">  
        <h3>Premium Cap</h3>  
        <div class="price">৳500</div>  
        <button class="cart-btn" onclick="addToCart('Premium Cap',500)">  
          Add to Cart  
        </button>  
      </div>  
    </div>  

  </div>  
</section>  

<section class="cart" id="cart">  
  <h2>Your Cart 🛒</h2>  
  <div id="cartItems">Cart is empty.</div>  
  <div class="total" id="cartTotal">Total: ৳0</div>  
</section>

  </main>    <footer>  
    <p><strong>Gadhuli | Official Website</strong></p>  
    <p>© 2026 Gadhuli. All rights reserved.</p>  
  </footer>    <script>  
    let cart = [];  
  
    function addToCart(name, price){  
      cart.push({name:name, price:price});  
      showCart();  
    }  
  
    function removeFromCart(index){  
      cart.splice(index,1);  
      showCart();  
    }  
  
    function showCart(){  
      const items = document.getElementById("cartItems");  
      const total = document.getElementById("cartTotal");  
  
      if(cart.length === 0){  
        items.innerHTML = "Cart is empty.";  
        total.innerHTML = "Total: ৳0";  
        return;  
      }  
  
      let html = "";  
      let sum = 0;  
  
      cart.forEach((item,index)=>{  
        sum += item.price;  
  
        html += `  
          <div class="cart-item">  
            <span>${item.name} — ৳${item.price}</span>  
            <button class="remove-btn"  
              onclick="removeFromCart(${index})">Remove</button>  
          </div>  
        `;  
      });  
  
      items.innerHTML = html;  
      total.innerHTML = "Total: ৳" + sum;  
    }  
  </script>  </body>  
</html>
