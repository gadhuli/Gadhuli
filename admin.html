<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>Gadhuli | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#fff7fa;
  color:#333;
  min-height:100vh;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px #0001;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:45px;
  height:45px;
  object-fit:contain;
  border-radius:10px;
}

.logo b{
  font-size:23px;
  color:#8f174d;
}

.back{
  text-decoration:none;
  background:#8f174d;
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
}

.container{
  width:92%;
  max-width:800px;
  margin:35px auto;
}

.box{
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px #0001;
  margin-bottom:25px;
}

h1,h2,h3{
  color:#8f174d;
}

.login-box{
  max-width:500px;
  margin:50px auto;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:10px 0;
  outline:none;
  font-size:16px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
  background:#8f174d;
  color:#fff;
  font-size:15px;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-btn{
  width:100%;
  margin-top:8px;
}

.status{
  margin-top:15px;
  font-weight:bold;
  word-break:break-word;
}

#adminPanel{
  display:none;
}

.admin-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.actions{
  display:flex;
  gap:6px;
}

.edit{
  background:#ead0dc;
  color:#8f174d;
}

.delete{
  background:#8f174d;
}

.logout{
  background:#555;
  margin-top:15px;
}

.empty{
  color:#777;
  padding:15px 0;
}

#preview{
  display:flex;
  flex-wrap:wrap;
  margin:5px 0 10px;
}

.preview-img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  margin:5px;
  border:1px solid #ddd;
}

footer{
  background:#8f174d;
  color:#fff;
  text-align:center;
  padding:25px;
  margin-top:40px;
}

@media(max-width:600px){

  .logo b{
    font-size:19px;
  }

  .admin-item{
    align-items:flex-start;
  }

  .actions{
    flex-shrink:0;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">

    <img
      src="logo.png"
      alt="Gadhuli Logo"
      onerror="this.style.display='none'">

    <b>Gadhuli Admin</b>

  </div>

  <a
    class="back"
    href="index.html">
    ← Website
  </a>

</header>


<div class="container">

  <!-- LOGIN -->

  <div
    id="loginBox"
    class="box login-box">

    <h1>🔐 Admin Login</h1>

    <br>

    <p>Gadhuli Admin Dashboard</p>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Admin Email"
        required>

      <input
        id="password"
        type="password"
        placeholder="Password"
        required>

      <button
        class="login-btn"
        id="loginButton"
        type="submit">
        Login
      </button>

    </form>

    <div
      id="status"
      class="status">
    </div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel">

    <div class="box">

      <h2>🔐 Gadhuli Admin Panel</h2>

      <br>

      <p>
        Welcome to Gadhuli Admin Dashboard.
      </p>

      <button
        class="logout"
        type="button"
        onclick="logout()">
        Logout
      </button>

    </div>


    <!-- ADD PRODUCT -->

    <div class="box">

      <h2>➕ Add Product</h2>

      <br>

      <form id="productForm">

        <input
          id="pname"
          placeholder="Product Name"
          required>

        <input
          id="price"
          type="number"
          min="1"
          placeholder="Price"
          required>

        <label>
          🖼️ Product Images (3–5)
        </label>

        <input
          id="images"
          type="file"
          accept="image/*"
          multiple
          required>

        <div id="preview"></div>

        <button
          id="saveProductButton"
          type="submit">
          Save Product
        </button>

      </form>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

      <h2>📦 Manage Products</h2>

      <br>

      <div id="adminProducts"></div>

    </div>

  </div>

</div>


<footer>

  <h3>Gadhuli</h3>

  <p>Admin Dashboard</p>

  <br>

  <p>
    © 2026 Gadhuli | Official Website
  </p>

</footer>


<script>

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    /* =========================
       SUPABASE
    ========================= */

    const client =
      window.gadhuliSupabase;

    const status =
      document.getElementById("status");

    if(!client){

      status.innerText =
        "Supabase connection পাওয়া যায়নি ❌";

      status.style.color = "red";

      return;

    }


    /* =========================
       LOCAL PRODUCTS
    ========================= */

    let products = [];

    try{

      products = JSON.parse(
        localStorage.getItem(
          "gadhuli_products"
        ) || "null"
      );

    }catch(error){

      products = [];

    }


    if(!Array.isArray(products)){

      products = [
        {
          name:"Premium T-Shirt",
          price:800,
          images:[]
        },
        {
          name:"Stylish Watch",
          price:1200,
          images:[]
        },
        {
          name:"Casual Shirt",
          price:950,
          images:[]
        }
      ];

    }


    function saveProducts(){

      localStorage.setItem(
        "gadhuli_products",
        JSON.stringify(products)
      );

    }


    /* =========================
       ADMIN CHECK
    ========================= */

    async function adminCheck(user){

      if(!user){
        return false;
      }

      try{

        const result =
          await client
          .from("admins")
          .select("user_id")
          .eq("user_id",user.id)
          .maybeSingle();

        if(result.error){

          console.error(
            "Admin check error:",
            result.error
          );

          return false;

        }

        return !!result.data;

      }catch(error){

        console.error(error);

        return false;

      }

    }


    /* =========================
       LOGIN
    ========================= */

    document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(e){

        e.preventDefault();

        const loginButton =
          document.getElementById(
            "loginButton"
          );

        loginButton.disabled = true;
        loginButton.innerText =
          "Login হচ্ছে...";

        status.innerText =
          "Supabase-এর সাথে যোগাযোগ হচ্ছে...";

        status.style.color =
          "#8f174d";


        const email =
          document
          .getElementById("email")
          .value
          .trim();

        const password =
          document
          .getElementById("password")
          .value;


        try{

          const result =
            await client.auth
            .signInWithPassword({
              email:email,
              password:password
            });


          if(result.error){

            status.innerText =
              "Login failed ❌\n" +
              result.error.message;

            status.style.color =
              "red";

            return;

          }


          const user =
            result.data.user;


          if(!user){

            status.innerText =
              "User পাওয়া যায়নি ❌";

            status.style.color =
              "red";

            return;

          }


          const isAdmin =
            await adminCheck(user);


          if(!isAdmin){

            await client.auth.signOut();

            status.innerText =
              "এই account-এর Admin Access নেই ❌";

            status.style.color =
              "red";

            return;

          }


          status.innerText =
            "Admin Login সফল হয়েছে ✅";

          status.style.color =
            "green";


          document
          .getElementById("loginBox")
          .style.display = "none";


          document
          .getElementById("adminPanel")
          .style.display = "block";


          await showAdmin();


        }catch(error){

          console.error(
            "Login error:",
            error
          );

          status.innerText =
            "Login Error ❌\n" +
            error.message;

          status.style.color =
            "red";

        }finally{

          loginButton.disabled =
            false;

          loginButton.innerText =
            "Login";

        }

      }
    );


    /* =========================
       SESSION CHECK
    ========================= */

    async function checkSession(){

      try{

        const result =
          await client.auth.getUser();


        if(result.error){
          return;
        }


        const user =
          result.data.user;


        if(!user){
          return;
        }


        const isAdmin =
          await adminCheck(user);


        if(isAdmin){

          document
          .getElementById("loginBox")
          .style.display = "none";


          document
          .getElementById("adminPanel")
          .style.display = "block";


          await showAdmin();

        }

      }catch(error){

        console.error(
          "Session error:",
          error
        );

      }

    }


    /* =========================
       IMAGE PREVIEW
    ========================= */

    document
    .getElementById("images")
    .addEventListener(
      "change",
      function(){

        const preview =
          document.getElementById(
            "preview"
          );

        preview.innerHTML = "";


        const files =
          this.files;


        if(
          files.length < 3 ||
          files.length > 5
        ){

          preview.innerHTML =
            "<p style='color:red'>" +
            "⚠️ ৩–৫টি ছবি select করুন" +
            "</p>";

          return;

        }


        Array.from(files)
        .forEach(function(file){

          const img =
            document.createElement(
              "img"
            );

          img.className =
            "preview-img";

          img.src =
            URL.createObjectURL(
              file
            );

          preview.appendChild(img);

        });

      }
    );


    /* =========================
       ADD PRODUCT
    ========================= */

    document
    .getElementById("productForm")
    .addEventListener(
      "submit",
      async function(e){

        e.preventDefault();


        const name =
          document
          .getElementById("pname")
          .value
          .trim();


        const price =
          Number(
            document
            .getElementById("price")
            .value
          );


        const files =
          document
          .getElementById("images")
          .files;


        if(!name){

          alert(
            "Product name দিন ❌"
          );

          return;

        }


        if(price <= 0){

          alert(
            "Valid price দিন ❌"
          );

          return;

        }


        if(
          files.length < 3 ||
          files.length > 5
        ){

          alert(
            "৩–৫টি ছবি select করুন ❌"
          );

          return;

        }


        const saveButton =
          document.getElementById(
            "saveProductButton"
          );


        saveButton.disabled = true;

        saveButton.innerText =
          "Database-এ Save হচ্ছে...";


        try{

          /*
           * STEP 5B:
           * এখন Product Database-এ
           * Save হবে।
           *
           * Image Storage upload
           * পরের ধাপে করব।
           */


          const result =
            await client
            .from("products")
            .insert([
              {
                name:name,
                price:price,
                images:[],
                category:"Others"
              }
            ])
            .select()
            .single();


          if(result.error){

            console.error(
              "Product insert error:",
              result.error
            );

            alert(
              "Product Database-এ Save হয়নি ❌\n\n" +
              result.error.message
            );

            return;

          }


          const newProduct =
            result.data;


          /*
           * Local list-এও রাখছি
           * যাতে Admin Panel-এ
           * সঙ্গে সঙ্গে দেখা যায়।
           */

          products.push({
            id:newProduct.id,
            name:newProduct.name,
            price:newProduct.price,
            images:newProduct.images || [],
            category:
              newProduct.category ||
              "Others"
          });


          saveProducts();

          await showAdmin();


          document
          .getElementById("productForm")
          .reset();


          document
          .getElementById("preview")
          .innerHTML = "";


          alert(
            "Product Supabase Database-এ Save হয়েছে ✅"
          );


        }catch(error){

          console.error(
            "Product error:",
            error
          );

          alert(
            "Product Save Error ❌\n\n" +
            error.message
          );

        }finally{

          saveButton.disabled =
            false;

          saveButton.innerText =
            "Save Product";

        }

      }
    );


    /* =========================
       SHOW PRODUCTS
    ========================= */

    async function showAdmin(){

      const box =
        document.getElementById(
          "adminProducts"
        );


      box.innerHTML =
        "Products load হচ্ছে...";


      /*
       * Database থেকে
       * সর্বশেষ products আনার চেষ্টা।
       */

      try{

        const result =
          await client
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending:false
            }
          );


        if(!result.error){

          if(
            Array.isArray(
              result.data
            )
          ){

            products =
              result.data;

            saveProducts();

          }

        }else{

          console.error(
            "Products load error:",
            result.error
          );

        }

      }catch(error){

        console.error(error);

      }


      box.innerHTML = "";


      if(!products.length){

        box.innerHTML =
          '<div class="empty">' +
          'কোনো product নেই।' +
          '</div>';

        return;

      }


      products.forEach(
        function(p,i){

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "admin-item";


          item.innerHTML = `

            <div>

              <b>
                ${escapeHTML(
                  p.name || "Unnamed"
                )}
              </b>

              <br>

              ৳${Number(
                p.price || 0
              )}

              <br>

              <small>
                ${
                  p.category ||
                  "Others"
                }
              </small>

            </div>

            <div class="actions">

              <button
                class="edit"
                onclick="editProduct(${i})">
                ✏️
              </button>

              <button
                class="delete"
                onclick="deleteProduct(${i})">
                🗑️
              </button>

            </div>

          `;


          box.appendChild(item);

        }
      );

    }


    /* =========================
       SAFE TEXT
    ========================= */

    function escapeHTML(value){

      return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(
        /'/g,
        "&#039;"
      );

    }


    /* =========================
       EDIT PRODUCT
    ========================= */

    window.editProduct =
    async function(i){

      if(!products[i]){
        return;
      }


      const product =
        products[i];


      const name =
        prompt(
          "Product Name:",
          product.name
        );


      if(name === null){
        return;
      }


      const price =
        prompt(
          "Price:",
          product.price
        );


      if(price === null){
        return;
      }


      const newName =
        name.trim();


      const newPrice =
        Number(price);


      if(
        !newName ||
        newPrice <= 0
      ){

        alert(
          "Valid product name ও price দিন ❌"
        );

        return;

      }


      try{

        /*
         * Database product হলে
         * id ব্যবহার করে update।
         */

        if(product.id){

          const result =
            await client
            .from("products")
            .update({
              name:newName,
              price:newPrice
            })
            .eq(
              "id",
              product.id
            );


          if(result.error){

            throw result.error;

          }

        }


        products[i] = {
          ...products[i],
          name:newName,
          price:newPrice
        };


        saveProducts();

        await showAdmin();


        alert(
          "Product update হয়েছে ✅"
        );


      }catch(error){

        console.error(error);

        alert(
          "Product update হয়নি ❌\n\n" +
          error.message
        );

      }

    };


    /* =========================
       DELETE PRODUCT
    ========================= */

    window.deleteProduct =
    async function(i){

      if(!products[i]){
        return;
      }


      const product =
        products[i];


      if(
        !confirm(
          `"${product.name}" delete করবেন?`
        )
      ){

        return;

      }


      try{

        if(product.id){

          const result =
            await client
            .from("products")
            .delete()
            .eq(
              "id",
              product.id
            );


          if(result.error){

            throw result.error;

          }

        }


        products.splice(i,1);

        saveProducts();

        await showAdmin();


        alert(
          "Product delete হয়েছে 🗑️"
        );


      }catch(error){

        console.error(error);

        alert(
          "Product delete হয়নি ❌\n\n" +
          error.message
        );

      }

    };


    /* =========================
       LOGOUT
    ========================= */

    window.logout =
    async function(){

      try{

        await client.auth.signOut();

      }catch(error){

        console.error(error);

      }


      document
      .getElementById("adminPanel")
      .style.display = "none";


      document
      .getElementById("loginBox")
      .style.display = "block";


      document
      .getElementById("password")
      .value = "";


      status.innerText =
        "Logout হয়েছে ✅";

      status.style.color =
        "#8f174d";

    };


    /* =========================
       START
    ========================= */

    await checkSession();

  }

);

</script>

</body>
</html>
